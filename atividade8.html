<html>
<head>
 <meta charset="UTF-8">
<title>Cadastro de Alunos</title>
</head>
<body>

<h2>Cadastro de Alunos </h2>
<form action="#" method="POST">

<!--Nome do Aluno -->
<p>
<label for="nome">Nome Completo:</label><br>
  <input type="text" id="nome" name=nome" placholder="Digite seu nome" required>
</p>

<!-- E-mail do Aluno -->
<p>
<label for="email">E-mail:</label><br>
<input type="email" id="email" name="email" placeholder=seuemail@exemplo.com" required>
</p>
<!--Senha de Acesso-->
<p>
 <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" required>
<p>
<!--Campo de Seleção (Dropdown)-->
<p>
<label for="assunto">Assunto:</label><br><select id="assunto name=assunto">
<option value="duvida">Informática</option>
<option value="sugestao">Atividade</option>
<option value="suporte">Dúvida</option>
<option value="suporte">Ajuda</option>

</select>
</p>

<!-- Caixa de Texto Grande -->
<p>
   <label for="mensagem">Comentáro:<label><br><textarea id="mensagem" name="mensagem" rows="4" col"30" placeholder="Digite seu comentário..."></textarea>
</p>

<!-- Botão de Envio -->
<p>
  <button type="submit">Cadastrar</button><button type="reset">Apagar</button>
</p>

</form>

</body>
</html>
